name: Update private profile statistics

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require private statistics token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "::error::Add PROFILE_STATS_TOKEN in this repository's Actions secrets, then rerun this workflow."
            exit 1
          fi

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: stats
          options: username=FIY-pc&show_icons=true&theme=radical&card_width=495&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"

      - name: Generate compact language card
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: top-langs
          options: username=FIY-pc&layout=compact&langs_count=6&theme=radical&card_width=495&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"

      - name: Save successfully generated cards
        run: |
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
